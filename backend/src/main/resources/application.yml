# MapMyRoad backend configuration. Secrets come from environment variables only (SECURITY.md section 10).
spring:
  application:
    name: mapmyroad-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roadquality}
    username: ${DB_USER:roadquality}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: 8080
  # Problem details are produced by our own handler (API_SPEC.md section 3).
  error:
    include-stacktrace: never
    include-message: never

# Actuator on a separate port that is never published or proxied (ADR-0015).
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

mmr:
  valhalla:
    base-url: ${VALHALLA_URL:http://localhost:8002}
  # Supported region as minLon,minLat,maxLon,maxLat (API_SPEC.md section 5.1). Illustrative default around Pune.
  supported-region-bbox: ${SUPPORTED_REGION_BBOX:72.6,17.9,75.1,19.6}
  min-supported-app-version: ${MIN_SUPPORTED_APP_VERSION:1.0.0}
  uploads-enabled: ${UPLOADS_ENABLED:true}
  # POST /v1/events limits and plausibility bounds (API_SPEC.md section 5.3). Initial values to tune.
  ingest:
    max-events-per-request: 500
    max-windows-per-request: 1000
    min-event-speed-kmh: 10
    max-speed-kmh: 200
    max-future-skew: PT5M
    max-age: P14D
    min-window-length-m: 20
    max-window-length-m: 120
  # Nightly retention job (DATABASE_SCHEMA.md A10). Changing a period needs an ADR (AGENTS.md section 6).
  retention:
    enabled: true
    cron: "0 30 3 * * *"
    zone: Asia/Kolkata
    device-id-days: 90
    trip-token-hours: 24
    raw-row-days: 365
    inactive-device-months: 12
    batch-size: 5000
  # Device identity and tokens (API_SPEC.md section 2, SECURITY.md sections 5 and 10). Secrets come from env only.
  # The local and test profiles turn integrity enforcement off; the prod profile refuses to start without it.
  device:
    integrity-enforced: true
    package-name: com.mapmyroad
    play-integrity-service-account-file: ${PLAY_INTEGRITY_SA_FILE:}
    # kid1:base64Secret,kid2:base64Secret, newest first, each secret >= 256 bits. Required outside local/test.
    jwt-keys: ${JWT_KEYS:}
    access-token-ttl: PT1H
    # Longer than the 90-day device ID detachment (DATABASE_SCHEMA.md A10), so a forced re-registration can never
    # leave data that is still tied to the old install ID out of reach of "delete my data" (PRD PV-3).
    refresh-token-ttl: P180D
    nonce-ttl: PT5M
  # Route candidates and comfort scoring (API_SPEC.md 5.8, ARCHITECTURE.md 8.4). Initial values; TODO(M1-5) calibrate.
  routing:
    max-alternates: 2
    max-candidates: 3
    resolve-way-ids: true
    min-origin-destination-m: 50
    hazard-buffer-m: 15
    min-hazard-confidence: 0.3
    segment-buffer-with-ways-m: 10
    segment-buffer-without-ways-m: 8
    min-segment-samples: 3
    severity-weight-minor: 1
    severity-weight-moderate: 3
    severity-weight-severe: 8
    roughness-weight: 20
    normalization-factor: 3.75
    min-normalization-length-km: 0.5
    coverage-partial-from: 0.2
    coverage-good-from: 0.7
    candidate-ttl: PT15M
    candidate-cache-max-entries: 10000
  # Geocoding proxy to Photon (API_SPEC.md section 5.7, M4-13). The host comes only from here (SECURITY.md T12).
  # The default is the public fair-use instance; switch PHOTON_URL to the self-hosted index when usage grows.
  geocode:
    enabled: ${GEOCODE_ENABLED:true}
    base-url: ${PHOTON_URL:https://photon.komoot.io}
    # Fair use asks for an identifying User-Agent. Replace the placeholder with a real contact before launch.
    user-agent: ${PHOTON_USER_AGENT:MapMyRoad/0.1 (+contact placeholder)}
    connect-timeout: PT2S
    read-timeout: PT5S
    cache-ttl: P7D
    negative-cache-ttl: PT1H
    memory-cache-size: 10000
    upstream-max-concurrent: 4
    upstream-queue-timeout: PT1S
    # lang values the configured Photon accepts; others are omitted upstream. Verify against the instance in use.
    supported-languages: en
  # Publication thresholds for tiles and the hazards API (API_SPEC.md 5.4, SECURITY.md T2 and 6.4). Initial
  # values. Lowering any of them weakens a privacy control and needs an ADR (AGENTS.md section 6).
  visibility:
    min-samples: 3
    min-devices: 2
    min-devices-low-traffic: 3
    low-traffic-highways: [residential, service, living_street, unclassified]
    excluded-access-values: [private, "no"]
    hazard-min-confidence: 0.3
  # Vector tiles and TileJSON (API_SPEC.md 5.4). The server cache is invalidated by time only.
  tiles:
    public-base-url: ${PUBLIC_BASE_URL:https://api.example.com}
    cache-max-age-seconds: 300
    server-cache-ttl: PT60S
    server-cache-max-bytes: 67108864
  # Map-matching job (M4-9, DATABASE_SCHEMA.md A6). Initial values to tune.
  matching:
    enabled: true
    fixed-delay: PT60S
    trips-per-run: 50
    max-snap-distance-m: 25
    max-points-per-request: 2000
    settle-delay: PT1M
    orphan-batch-size: 5000
  # Aggregation, nightly refresh and recompute queue (M4-10, ARCHITECTURE.md section 8). Initial values, not
  # measured; TODO(M1-5) calibrate the roughness values together with the app's DetectorConfig.
  aggregation:
    enabled: true
    fixed-delay: PT5M
    recompute-fixed-delay: PT2M
    batch-size: 500
    max-batches-per-run: 100
    cluster-radius-m: 12
    suppression-radius-m: 15
    recency-half-life-days: 30
    clean-pass-radius-m: 10
    clean-pass-roughness-max: 0.6
    clean-pass-event-window: PT60S
    clean-pass-event-radius-m: 20
    fixed-after-clean-passes: 3
    fixed-min-devices: 2
    stale-after-days: 60
    ewma-alpha: 0.2
    roughness-good: 0.3
    roughness-poor: 2.0
    nightly-cron: "0 15 4 * * *"
    zone: Asia/Kolkata
