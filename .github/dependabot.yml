# Dependabot version updates (M0-10, SECURITY.md section 11).
# Backend uses Gradle (wrapper in backend/). Docker covers the backend/Dockerfile base image.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Kotlin, KSP and the Compose compiler plugin must move together.
      kotlin-ksp:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      compose:
        patterns:
          - "androidx.compose*"
      androidx:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.compose*"
      android-gradle-plugin:
        patterns:
          - "com.android.*"

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The Spring Boot plugin and BOM manage most backend versions; move them together.
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      testcontainers:
        patterns:
          - "org.testcontainers*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
