# TODO(M0-10): pin each action to a full commit SHA (Dependabot keeps them updated).
# SECURITY.md section 11 requires SHA pinning. Major version tags are used here only
# because the SHAs could not be looked up when this file was written. Do not invent SHAs.
#
# Android CI (M0-4, DEPLOYMENT.md section 6.1, TESTING_STRATEGY.md section 12).
# Detector regression and Room migration tests join this job once they exist (M1, M2).

name: android-ci

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, unit tests, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Safe even if the executable bit is already recorded in Git
      # (git update-index --chmod=+x android/gradlew).
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Lint, unit tests and debug build
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
