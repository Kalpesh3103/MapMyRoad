# TODO(M0-10): pin each action to a full commit SHA (Dependabot keeps them updated).
# SECURITY.md section 11 requires SHA pinning. Major version tags are used here only
# because the SHAs could not be looked up when this file was written. Do not invent SHAs.
#
# Secret scan (SECURITY.md section 10, TESTING_STRATEGY.md section 12: any secret blocks merge).
#
# Choice: gitleaks/gitleaks-action@v2.
# - Free for personal-account repositories (public or private).
# - Repositories owned by a GitHub ORGANIZATION need a GITLEAKS_LICENSE secret
#   (free key from gitleaks.io). If the repo moves to an org, add the secret and
#   uncomment the env line below.
# - Alternative without a license: download the gitleaks release binary, verify its
#   checksum, and run `gitleaks detect --source . --redact --verbose`.
# A local pre-commit hook with gitleaks is also recommended (SECURITY.md section 10).

name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # The action lists the commits of a pull request through the API.
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # required only for organization-owned repos
          # No PR comments (would need write access) and no report artifact (could echo a secret).
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
