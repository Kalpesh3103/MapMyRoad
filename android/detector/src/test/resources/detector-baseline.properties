# Detector metric baseline for DetectorRegressionTest (M2-20, TESTING_STRATEGY.md section 3.2).
#
# SYNTHETIC BASELINE: these values come from idealized synthetic scenarios (SyntheticScenarios.kt), not from real
# drives, and say nothing about real-road accuracy. Replace them when real fixtures from M1-8 exist
# (TESTING_STRATEGY.md section 3.2): add fixtures.all.<metric> keys measured on src/test/resources/traces/.
#
# Values are set conservatively below what the current implementation measured on these scenarios (1.00 for
# every metric at the time of writing), so harmless numeric changes do not break the build. The test fails when
# a metric drops more than 0.02 below its value here. All metrics are higher-is-better; the speed-breaker
# false-alarm rate is stored as its complement, speedBreakerCleanPassRate. Raise values in the same PR that
# improves a metric, with an explanation.

